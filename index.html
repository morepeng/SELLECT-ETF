<!-- 請把這段放在 index.html 最後一個原始 <script> 區塊之前 -->
<script>
/* =========================================================
   MOBILE PERFORMANCE PATCH
   直接使用附件 index.html 內已存在的 DataService、CONFIG、State
   ========================================================= */

CONFIG.R1_TOP_N_ETF = 4;
CONFIG.R1_TOP_HOLDINGS = 8;
CONFIG.MAX_WORKERS = 4;
CONFIG.REQUEST_DELAY = 80;

const _mobileCache = new Map();
const _mobilePending = new Map();
const _mobileOldGetOHLCV = DataService.getOHLCV.bind(DataService);

DataService.getOHLCV = async function (ticker, period = '1y', interval = '1d') {
  const key = `${ticker}|${period}|${interval}`;
  if (_mobileCache.has(key)) return _mobileCache.get(key);
  if (_mobilePending.has(key)) return _mobilePending.get(key);

  const request = _mobileOldGetOHLCV(ticker, period, interval)
    .then(rows => {
      if (rows) _mobileCache.set(key, rows);
      return rows;
    })
    .finally(() => _mobilePending.delete(key));

  _mobilePending.set(key, request);
  return request;
};

function mobileSleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function mobileMapLimit(items, limit, worker, progress) {
  const output = new Array(items.length);
  let cursor = 0;
  let finished = 0;

  async function runner() {
    while (true) {
      const index = cursor++;
      if (index >= items.length) return;
      try {
        output[index] = await worker(items[index], index);
      } catch (error) {
        output[index] = null;
      }
      finished++;
      progress?.(finished, items.length, output[index]);
      await mobileSleep(80);
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(limit, items.length) }, runner)
  );
  return output;
}

async function runAnalysisMobile() {
  log('🚀 手機效能模式啟動', 'header');
  updateKillZone();

  log('════ 第一輪：ETF 賽道篩選 ════', 'section');
  const screener = new ETFPreScreener(CONFIG);
  const tasks = Object.entries(ETF_UNIVERSE).flatMap(([market, tickers]) =>
    tickers.map(ticker => ({ ticker, market }))
  );

  const r1Rows = await mobileMapLimit(
    tasks,
    CONFIG.MAX_WORKERS || 4,
    ({ ticker, market }) => screener.screen(ticker, market),
    (done, total, result) => {
      const bar = document.getElementById('stats-bar');
      if (bar) bar.textContent = `第一輪 ${done}/${total}`;
      if (result?.price != null) {
        log(`→ ${result.ticker}: ${result.pass ? '✅' : '❌'} score=${result.score}`);
      }
    }
  );

  const passed = r1Rows.filter(row => row?.price != null && row.pass);
  const failed = r1Rows.filter(row => row?.price != null && !row.pass);
  State.r1Results = { passed, failed };
  renderR1Table(passed, failed);

  const topEtfs = selectTopEtfsByMarket(
    passed,
    CONFIG.R1_MIN_KEEP_BY_MARKET,
    CONFIG.R1_TOP_N_ETF
  );
  State.topEtfs = topEtfs;
  log(`📋 第二輪 ETF：${topEtfs.join(', ') || '無'}`, 'info');

  const stocks = [];
  const seen = new Set();
  for (const etf of topEtfs) {
    for (const ticker of (ETF_HOLDINGS[etf] || []).slice(0, CONFIG.R1_TOP_HOLDINGS)) {
      if (!seen.has(ticker)) {
        seen.add(ticker);
        stocks.push({ stk: ticker, etf });
      }
    }
  }

  log(`📊 第二輪分析 ${stocks.length} 檔`, 'info');
  const scorer = new ICTSMCScorer(CONFIG);
  const r2Rows = await mobileMapLimit(
    stocks,
    CONFIG.MAX_WORKERS || 4,
    ({ stk, etf }) => scorer.analyze(stk, etf),
    (done, total, result) => {
      const bar = document.getElementById('stats-bar');
      if (bar) bar.textContent = `第二輪 ${done}/${total}`;
      if (result?.success) log(`${result.action}: ${result.ticker} score=${result.score}`);
    }
  );

  const results = r2Rows.filter(Boolean);
  const order = { BUY: 0, WATCH: 1, SELL: 2, SKIP: 3 };
  results.sort((a, b) => (order[a.action] - order[b.action]) || (b.score - a.score));

  State.r2Results = results;
  renderR2Table(results);
  document.dispatchEvent(new CustomEvent('r2-complete', { detail: results }));

  const buy = results.filter(r => r.action === 'BUY').length;
  const watch = results.filter(r => r.action === 'WATCH').length;
  const skip = results.filter(r => r.action === 'SKIP').length;
  const bar = document.getElementById('stats-bar');
  if (bar) bar.textContent = `✅ 完成 | BUY: ${buy} | WATCH: ${watch} | SKIP: ${skip}`;
  const exportButton = document.getElementById('btn-export');
  if (exportButton) exportButton.disabled = false;
}

/* 將原本按鈕綁定的 runAnalysis 改成手機版流程 */
const mobileRunButton = document.getElementById('btn-run');
if (mobileRunButton) {
  mobileRunButton.onclick = async () => {
    if (State.running) return;
    State.running = true;
    mobileRunButton.disabled = true;
    mobileRunButton.textContent = '⚡ 分析中...';
    document.getElementById('log').innerHTML = '';
    document.getElementById('r1-table-body').innerHTML = '';
    document.getElementById('r2-table-body').innerHTML = '';
    try {
      await runAnalysisMobile();
    } catch (error) {
      log(`❌ ${error.message || error}`, 'warn');
    } finally {
      State.running = false;
      mobileRunButton.disabled = false;
      mobileRunButton.textContent = '▶ 執行掃描';
    }
  };
}
</script>
