name: Update market data

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays 21:30 UTC (after the US close)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch OHLCV (daily, 1y)
        run: python scripts/fetch_ohlcv.py

      - name: Fetch fundamentals (best effort)
        continue-on-error: true
        run: python scripts/fetch_fundamentals.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update market data"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
